<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 430" role="img" aria-labelledby="title desc">
  <title id="title">專有名詞理解流程</title>
  <desc id="desc">學習者在教材遇到不懂名詞時，點擊名詞連結，閱讀白話定義、實際用途與常見錯誤，再把理解帶回原本的學習階段繼續操作。</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width=".5"/></pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#60a5fa"/></marker>
    <style>text{font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif}.title{font-size:24px;font-weight:700;fill:#f8fafc}.sub{font-size:12px;fill:#94a3b8}.name{font-size:15px;font-weight:700;fill:#f8fafc}.note{font-size:10px;fill:#cbd5e1}.label{font-size:10px;font-weight:700;fill:#93c5fd}</style>
  </defs>
  <rect width="1040" height="430" fill="#0f172a"/><rect width="1040" height="430" fill="url(#grid)"/>
  <text x="34" y="42" font-family="Arial Unicode MS" font-size="24" font-weight="700" fill="#f8fafc">看不懂專有名詞時，不需要先離開整個學習流程</text>
  <text x="34" y="65" font-family="Arial Unicode MS" font-size="12" fill="#94a3b8">點擊名詞進入獨立說明頁，理解後再回到原本階段。</text>
  <path d="M250 190H298M500 190H548M750 190H798" stroke="#60a5fa" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="260" y="178" font-family="Arial Unicode MS" font-size="10" font-weight="700" fill="#94a3b8">點名詞連結</text><text x="510" y="178" font-family="Arial Unicode MS" font-size="10" font-weight="700" fill="#94a3b8">讀三種資訊</text><text x="760" y="178" font-family="Arial Unicode MS" font-size="10" font-weight="700" fill="#94a3b8">帶回實際任務</text>
  <g><rect x="48" y="132" width="202" height="116" rx="10" fill="#0f172a"/><rect x="48" y="132" width="202" height="116" rx="10" fill="rgba(59,130,246,.28)" stroke="#60a5fa" stroke-width="1.5"/><text x="149" y="165" font-family="Arial Unicode MS" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">1｜遇到不懂的名詞</text><text x="149" y="191" font-family="Arial Unicode MS" font-size="10" fill="#cbd5e1" text-anchor="middle">例如 PRD、API、Agent</text><text x="149" y="211" font-family="Arial Unicode MS" font-size="10" fill="#cbd5e1" text-anchor="middle">名詞本身就是站內連結</text><text x="149" y="231" font-family="Arial Unicode MS" font-size="10" fill="#cbd5e1" text-anchor="middle">不用另外搜尋零散文章</text></g>
  <g><rect x="298" y="132" width="202" height="116" rx="10" fill="#0f172a"/><rect x="298" y="132" width="202" height="116" rx="10" fill="rgba(8,51,68,.55)" stroke="#22d3ee" stroke-width="1.5"/><text x="399" y="165" font-family="Arial Unicode MS" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">2｜開啟名詞說明頁</text><text x="399" y="191" font-family="Arial Unicode MS" font-size="10" fill="#cbd5e1" text-anchor="middle">先看白話定義</text><text x="399" y="211" font-family="Arial Unicode MS" font-size="10" fill="#cbd5e1" text-anchor="middle">再確認出現在哪一階段</text><text x="399" y="231" font-family="Arial Unicode MS" font-size="10" fill="#cbd5e1" text-anchor="middle">知道這個名詞為何出現</text></g>
  <g><rect x="548" y="132" width="202" height="116" rx="10" fill="#0f172a"/><rect x="548" y="132" width="202" height="116" rx="10" fill="rgba(76,29,149,.45)" stroke="#a78bfa" stroke-width="1.5"/><text x="649" y="165" font-family="Arial Unicode MS" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">3｜比較用法與錯誤</text><text x="649" y="191" font-family="Arial Unicode MS" font-size="10" fill="#cbd5e1" text-anchor="middle">正確使用：何時要做</text><text x="649" y="211" font-family="Arial Unicode MS" font-size="10" fill="#cbd5e1" text-anchor="middle">常見錯誤：哪些是假完成</text><text x="649" y="231" font-family="Arial Unicode MS" font-size="10" fill="#cbd5e1" text-anchor="middle">搭配含文字流程圖理解</text></g>
  <g><rect x="798" y="132" width="202" height="116" rx="10" fill="#0f172a"/><rect x="798" y="132" width="202" height="116" rx="10" fill="rgba(6,78,59,.45)" stroke="#34d399" stroke-width="1.5"/><text x="899" y="165" font-family="Arial Unicode MS" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">4｜回到相關階段</text><text x="899" y="191" font-family="Arial Unicode MS" font-size="10" fill="#cbd5e1" text-anchor="middle">把理解套回目前任務</text><text x="899" y="211" font-family="Arial Unicode MS" font-size="10" fill="#cbd5e1" text-anchor="middle">完成文件、畫面或測試</text><text x="899" y="231" font-family="Arial Unicode MS" font-size="10" fill="#cbd5e1" text-anchor="middle">留下可以驗收的證據</text></g>
  <path d="M899 248V322H149V248" stroke="#64748b" stroke-width="1.8" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow)"/>
  <text x="524" y="314" font-family="Arial Unicode MS" font-size="10" font-weight="700" fill="#94a3b8" text-anchor="middle">之後再遇到其他名詞，重複同一套理解方式</text>
  <rect x="254" y="346" width="532" height="42" rx="21" fill="rgba(120,53,15,.35)" stroke="#fbbf24"/>
  <text x="520" y="372" font-family="Arial Unicode MS" font-size="15" font-weight="700" fill="#f8fafc" text-anchor="middle">判斷是否理解：能不能用自己的話說明「它是什麼、何時用、怎麼驗收」</text>
  <text x="34" y="414" font-family="Arial Unicode MS" font-size="12" fill="#94a3b8">每張圖下方仍提供等價文字版；即使圖片無法載入，也能完成相同理解。</text>
</svg>
